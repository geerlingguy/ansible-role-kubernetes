---
- name: Include OS-specific variables.
  include_vars: "{{ ansible_facts.os_family }}.yml"
  when:
   - ansible_facts.distribution != 'Fedora'

- name: Include Distribution-specific variables.
  include_vars: "{{ ansible_facts.distribution }}.yml"
  when:
   - ansible_facts.distribution == 'Fedora'

- include_tasks: setup-RedHat.yml
  when: ansible_facts.os_family == 'RedHat'

- include_tasks: setup-Debian.yml
  when: ansible_facts.os_family == 'Debian'

- name: Ensure dependencies are installed.
  ansible.builtin.package:
    name: curl
    state: present
  failed_when: False

- name: Install Kubernetes packages.
  ansible.builtin.package:
   name: "{{ item.name | default(item) }}"
   state: "{{ item.state | default('present') }}"
  notify: restart_kubelet
  with_items: "{{ kubernetes_packages }}"

- include_tasks: sysctl-setup.yml

- include_tasks: kubelet-setup.yml  # deprecated
  when: kubernetes_kubelet_extra_args|length > 0

- name: Ensure kubelet is started and enabled at boot.
  ansible.builtin.service:
   name: kubelet
   state: started
   enabled: true

- name: Check if Kubernetes has already been initialized.
  stat:
   path: /etc/kubernetes/admin.conf
  register: kubernetes_init_stat

# Set up control plane.
- include_tasks: control-plane-setup.yml
  when: kubernetes_role == 'control_plane'

# Set up nodes.
- name: Get the kubeadm join command from the Kubernetes control plane.
  ansible.builtin.command: kubeadm token create --print-join-command
  changed_when: false
  when: kubernetes_role == 'control_plane'
  register: kubernetes_join_command_result

- include_tasks: networking.yml
  when: kubernetes_role == 'control_plane'

- name: Set the kubeadm join command globally.
  ansible.builtin.set_fact:
   kubernetes_join_command: >
     {{ kubernetes_join_command_result.stdout }}
     {{ kubernetes_join_command_extra_opts }}
  when: kubernetes_join_command_result.stdout is defined
  delegate_to: "{{ item }}"
  delegate_facts: true
  with_items: "{{ groups['all'] }}"

- include_tasks: node-setup.yml
  when: kubernetes_role == 'node'

- name: restart containerd and kubelet to ensure they pick up any changes
  ansible.builtin.service:  # https://github.com/k3s-io/k3s/issues/1857#issuecomment-950154218
   name: "{{ item }}"
   state: restarted
  with_items:
   - containerd
   - kubelet
  when: kubernetes_role in ['control_plane', 'node']
  become: true
